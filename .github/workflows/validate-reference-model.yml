name: Reference Model validation

on:
  pull_request:
  push:
    branches:
      - main
      - "prep/**"
  workflow_dispatch:

jobs:
  validate:
    name: Generate and validate source representations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rdflib==7.5.0 PyYAML==6.0.3 jsonschema==4.26.0
      - name: Regenerate derived projections
        run: python scripts/generate_projections.py --write
      - name: Verify generated projections are reproducible
        run: python scripts/generate_projections.py --check
      - name: Run release integrity checks
        run: python scripts/validate_reference_model.py
      - name: Verify public endpoints and MIME types
        if: github.ref == 'refs/heads/main'
        run: python scripts/validate_public_endpoints.py

  publish-generated-projections:
    name: Commit generated projections on main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rdflib==7.5.0 PyYAML==6.0.3 jsonschema==4.26.0
      - name: Regenerate projections
        run: python scripts/generate_projections.py --write
      - name: Commit generated projections when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add external-reception/index.html metadata/external-reception.ttl semantic-change-feed/index.html metadata.json llms.txt README.md semantic-change-feed/README.md sitemap.xml
          if git diff --cached --quiet; then
            echo "Generated projections are already current."
            exit 0
          fi
          git commit -m "Regenerate derived metadata projections"
          git push origin main
