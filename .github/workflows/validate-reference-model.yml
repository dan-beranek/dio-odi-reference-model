name: Reference Model validation

on:
  pull_request:
  push:
    branches:
      - main
      - "prep/**"
  workflow_dispatch:

jobs:
  validate:
    name: Generate and validate source representations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SCF review-intake unit tests when present
        run: |
          if [ -f scripts/prepare_scf_review_candidates.py ]; then
            python -m unittest discover -s tests -p "test_scf_review_candidates.py" -v
          else
            echo "SCF review-intake scanner is not present on this branch; skipping its tests."
          fi

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rdflib==7.5.0 PyYAML==6.0.3 jsonschema==4.26.0
      - name: Verify pinned Entity Registry snapshot
        run: python scripts/verify_entity_registry.py
      - name: Regenerate derived projections
        run: python scripts/generate_projections.py --write
      - name: Generate canonical page-level keyword metadata
        run: python scripts/generate_surface_metadata.py --write
      - name: Generate agent discovery manifests
        run: python scripts/generate_agent_discovery.py --write
      - name: Verify generated projections are reproducible
        run: python scripts/generate_projections.py --check
      - name: Verify page-level keyword metadata is reproducible
        run: python scripts/generate_surface_metadata.py --check
      - name: Verify agent discovery manifests are reproducible
        run: python scripts/generate_agent_discovery.py --check
      - name: Validate subdomain JSON-LD identity graph
        run: python scripts/validate_subdomain_jsonld.py
      - name: Run release integrity checks
        run: python scripts/validate_reference_model.py
      - name: Verify public endpoints and MIME types
        if: github.ref == 'refs/heads/main'
        run: python scripts/validate_public_endpoints.py

  publish-generated-projections:
    name: Commit generated projections on main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rdflib==7.5.0 PyYAML==6.0.3 jsonschema==4.26.0
      - name: Verify pinned Entity Registry snapshot
        run: python scripts/verify_entity_registry.py
      - name: Regenerate projections
        run: |
          python scripts/generate_projections.py --write
          python scripts/generate_surface_metadata.py --write
          python scripts/generate_agent_discovery.py --write
      - name: Commit generated projections when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dio-odi/index.html external-reception/index.html metadata/external-reception.ttl mappings/index.html mappings/rag-pipeline/index.html mappings/hem-dio/index.html mappings/commit-boundary-policy/index.html mappings/agentic-er-architecture/index.html metadata/index.html semantic-change-feed/index.html assets/data/resolved-page-metadata.json semantic-change-feed/events.json metadata.json .zenodo.json CITATION.cff llms.txt README.md metadata/README.md semantic-change-feed/README.md sitemap.xml .well-known/ard.json .well-known/ai-catalog.json
          if git diff --cached --quiet; then
            echo "Generated projections are already current."
            exit 0
          fi
          git commit -m "Regenerate derived metadata projections"
          git push origin main
