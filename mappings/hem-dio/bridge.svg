<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">HEM heterogeneity conditions to DIO reconstruction consequences</title>
  <desc id="desc">A three-layer conceptual diagram. HEM representation and semantic heterogeneity are input conditions, which exert reconstruction pressure, leading to possible DIO reconstruction failures or increased Semantic Vulnerability. The diagram explicitly states that the relation is not equivalence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <style>
      .bg{fill:#fff}
      .box{fill:#f7f7f7;stroke:#222;stroke-width:2}
      .soft{fill:#fbfbfb;stroke:#777;stroke-width:1.5}
      .dash{fill:#fbfbfb;stroke:#666;stroke-width:2;stroke-dasharray:7 6}
      .title{font:700 27px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111}
      .head{font:700 19px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111}
      .text{font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#222}
      .small{font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#444}
      .note{font:italic 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#555}
      .line{stroke:#555;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="600" y="42" text-anchor="middle">HEM heterogeneity conditions → DIO reconstruction consequences</text>
  <text class="note" x="600" y="68" text-anchor="middle">Analytical mapping, not taxonomic equivalence or deterministic causality</text>

  <rect class="box" x="50" y="105" width="330" height="500" rx="14"/>
  <text class="head" x="215" y="140" text-anchor="middle">HEM heterogeneity conditions</text>

  <rect class="soft" x="80" y="170" width="270" height="155" rx="10"/>
  <text class="head" x="215" y="202" text-anchor="middle">Representation</text>
  <text class="text" x="105" y="235">• Multimodality</text>
  <text class="text" x="105" y="265">• Format Heterogeneity</text>
  <text class="text" x="105" y="295">• Structural (Schema) Heterogeneity</text>

  <rect class="soft" x="80" y="350" width="270" height="220" rx="10"/>
  <text class="head" x="215" y="382" text-anchor="middle">Semantic</text>
  <text class="text" x="105" y="415">• Terminology &amp; Language</text>
  <text class="text" x="105" y="445">• Contextual Variability</text>
  <text class="text" x="105" y="475">• Granularity &amp; Resolution</text>
  <text class="text" x="105" y="505">• Temporal Variability</text>
  <text class="text" x="105" y="535">• Data Quality</text>

  <rect class="dash" x="445" y="215" width="310" height="280" rx="14"/>
  <text class="head" x="600" y="255" text-anchor="middle">Reconstruction pressure</text>
  <text class="text" x="475" y="300">Legibility / parsing</text>
  <text class="text" x="475" y="333">Alignment / correspondence</text>
  <text class="text" x="475" y="366">Evidence balance</text>
  <text class="text" x="475" y="399">Context / temporal fit</text>
  <text class="text" x="475" y="432">Robustness under perturbation</text>
  <text class="small" x="600" y="472" text-anchor="middle">Intermediate analytical layer</text>

  <rect class="box" x="820" y="105" width="330" height="500" rx="14"/>
  <text class="head" x="985" y="140" text-anchor="middle">DIO consequences</text>

  <rect class="soft" x="850" y="170" width="270" height="275" rx="10"/>
  <text class="head" x="985" y="202" text-anchor="middle">Reconstruction Failure Modes</text>
  <text class="text" x="875" y="235">• Entity Substitution</text>
  <text class="text" x="875" y="265">• Merge / Split Failure</text>
  <text class="text" x="875" y="295">• Semantic Fragmentation</text>
  <text class="text" x="875" y="325">• Temporal Discontinuity</text>
  <text class="text" x="875" y="355">• Temporal Misalignment</text>
  <text class="text" x="875" y="385">• Contextual Displacement</text>
  <text class="small" x="985" y="420" text-anchor="middle">Realized reconstruction failures</text>

  <rect class="dash" x="850" y="470" width="270" height="100" rx="10"/>
  <text class="head" x="985" y="505" text-anchor="middle">Semantic Vulnerability</text>
  <text class="small" x="985" y="535" text-anchor="middle">Susceptibility, not a failure mode</text>

  <path class="line" d="M380 355 L445 355"/>
  <path class="line" d="M755 355 L820 355"/>

  <text class="small" x="412" y="338" text-anchor="middle">may affect</text>
  <text class="small" x="788" y="338" text-anchor="middle">may contribute to</text>
  <text class="small" x="600" y="650" text-anchor="middle">HEM characterizes heterogeneous input conditions; DIO characterizes possible consequences for identity reconstruction.</text>
</svg>
