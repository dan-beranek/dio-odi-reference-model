<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">DIO/ODI Reconstruction Failure Mode concept map</title>
  <desc id="desc">The Reconstruction Failure Mode taxonomy with four branches and related concepts outside the hierarchy: Identity Collapse, Semantic Vulnerability, Semantic Robustness, and Reconstruction Capture.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:10;ry:10}
      .outside{fill:#fff;stroke:#666;stroke-width:2;stroke-dasharray:8 6;rx:10;ry:10}
      .edge{fill:none;stroke:#333;stroke-width:2;marker-end:url(#arrow)}
      .related{fill:none;stroke:#666;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .label{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:18px;fill:#171717;text-anchor:middle}
      .small{font-size:15px;fill:#444}
      .edge-label{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;fill:#555;text-anchor:middle}
    </style>
  </defs>

  <!-- taxonomy edges -->
  <path class="edge" d="M600 88 V120 H160 V155"/>
  <path class="edge" d="M600 88 V120 H440 V155"/>
  <path class="edge" d="M600 88 V120 H720 V155"/>
  <path class="edge" d="M600 88 V120 H1000 V155"/>

  <path class="edge" d="M160 213 V250 H90 V285"/>
  <path class="edge" d="M160 213 V250 H235 V285"/>
  <path class="edge" d="M160 213 V250 H380 V285"/>
  <path class="edge" d="M160 213 V250 H525 V285"/>

  <path class="edge" d="M440 213 V360"/>
  <path class="edge" d="M720 213 V250 H670 V285"/>
  <path class="edge" d="M720 213 V250 H815 V285"/>
  <path class="edge" d="M1000 213 V285"/>

  <!-- related edges -->
  <path class="related" d="M90 333 C90 430,120 475,180 545"/>
  <text class="edge-label" x="126" y="456">related</text>

  <path class="related" d="M380 333 C390 345,410 352,440 360"/>
  <text class="edge-label" x="500" y="347">related, not equivalent</text>

  <path class="related" d="M760 625 H900"/>
  <text class="edge-label" x="830" y="612">related</text>

  <path class="related" d="M760 645 C840 700,905 720,980 720"/>
  <text class="edge-label" x="878" y="695">related</text>

  <!-- root -->
  <rect class="box" x="450" y="30" width="300" height="58"/>
  <text class="label" x="600" y="65">Reconstruction Failure Modes</text>

  <!-- branches -->
  <rect class="box" x="35" y="155" width="250" height="58"/>
  <text class="label" x="160" y="180">
    <tspan x="160" dy="0">Referential Reconstruction</tspan>
    <tspan x="160" dy="22">Failures</tspan>
  </text>

  <rect class="box" x="315" y="155" width="250" height="58"/>
  <text class="label" x="440" y="180">
    <tspan x="440" dy="0">Semantic Coherence</tspan>
    <tspan x="440" dy="22">Failures</tspan>
  </text>

  <rect class="box" x="595" y="155" width="250" height="58"/>
  <text class="label" x="720" y="180">
    <tspan x="720" dy="0">Temporal Reconstruction</tspan>
    <tspan x="720" dy="22">Failures</tspan>
  </text>

  <rect class="box" x="875" y="155" width="250" height="58"/>
  <text class="label" x="1000" y="180">
    <tspan x="1000" dy="0">Contextual Adequacy</tspan>
    <tspan x="1000" dy="22">Failures</tspan>
  </text>

  <!-- child concepts -->
  <rect class="box" x="25" y="285" width="130" height="48"/>
  <text class="label small" x="90" y="314">Entity Substitution</text>

  <rect class="box" x="170" y="285" width="130" height="48"/>
  <text class="label small" x="235" y="314">Merge Failure</text>

  <rect class="box" x="315" y="285" width="130" height="48"/>
  <text class="label small" x="380" y="314">Split Failure</text>

  <rect class="box" x="460" y="285" width="130" height="48"/>
  <text class="label small" x="525" y="314">Entity Omission</text>

  <rect class="box" x="345" y="285" width="190" height="48" transform="translate(0 75)"/>
  <text class="label small" x="440" y="389">Semantic Fragmentation</text>

  <rect class="box" x="600" y="285" width="140" height="48"/>
  <text class="label small" x="670" y="314">
    <tspan x="670" dy="0">Temporal</tspan>
    <tspan x="670" dy="18">Discontinuity</tspan>
  </text>

  <rect class="box" x="745" y="285" width="140" height="48"/>
  <text class="label small" x="815" y="314">
    <tspan x="815" dy="0">Temporal</tspan>
    <tspan x="815" dy="18">Misalignment</tspan>
  </text>

  <rect class="box" x="905" y="285" width="190" height="48"/>
  <text class="label small" x="1000" y="314">Contextual Displacement</text>

  <!-- outside / related concepts -->
  <rect class="outside" x="65" y="545" width="230" height="72"/>
  <text class="label" x="180" y="574">
    <tspan x="180" dy="0">Identity Collapse</tspan>
    <tspan class="small" x="180" dy="24">phenomenon-level concept</tspan>
  </text>

  <rect class="outside" x="500" y="545" width="260" height="100"/>
  <text class="label" x="630" y="576">
    <tspan x="630" dy="0">Semantic Vulnerability</tspan>
    <tspan class="small" x="630" dy="24">robustness-related property</tspan>
  </text>

  <rect class="outside" x="900" y="585" width="230" height="72"/>
  <text class="label" x="1015" y="628">Semantic Robustness</text>

  <rect class="outside" x="900" y="690" width="230" height="72"/>
  <text class="label" x="1015" y="733">Reconstruction Capture</text>

  <!-- legend -->
  <path class="edge" d="M380 835 H455"/>
  <text class="edge-label" x="525" y="840" text-anchor="start">taxonomic relation</text>
  <path class="related" d="M680 835 H755"/>
  <text class="edge-label" x="825" y="840" text-anchor="start">related concept</text>
</svg>
